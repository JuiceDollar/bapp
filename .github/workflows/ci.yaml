name: CI Tests

on:
    pull_request:
        branches: [develop, main]
    push:
        branches: [develop]

permissions:
    contents: read

env:
    NEXT_PUBLIC_APP_URL: https://dev.app.juicedollar.com
    NEXT_PUBLIC_API_URL_MAINNET: https://dev.api.juicedollar.com/
    NEXT_PUBLIC_PONDER_URL_MAINNET: https://dev.ponder.juicedollar.com
    NEXT_PUBLIC_CHAIN_NAME: mainnet
    NEXT_PUBLIC_RPC_URL_MAINNET: https://rpc.citreascan.com/
    NEXT_PUBLIC_DEPLOYMENT_ENV: dev

jobs:
    test:
        name: Lint & Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Lint check
              run: yarn lint

            - name: Prettier check
              run: yarn lint:check

            - name: Build
              run: yarn build
